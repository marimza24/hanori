  <style>

    :root {

      --cream: #fbf4ed;
      --cream-dark: #eee2d8;

      --pink: #d6a4a6;
      --pink-soft: #f3dddd;

      --blue: #9ebacb;
      --blue-soft: #e7f0f6;

      --brown: #604554;
      --brown-dark: #302528;

      --text: #3f3638;
      --muted: #7f7173;

      --white: #ffffff;

      --shadow:
        0 18px 50px
        rgba(80, 60, 65, 0.10);

    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      font-family:
        "Nunito",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at top left,
          rgba(214, 164, 166, 0.22),
          transparent 32%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(158, 186, 203, 0.25),
          transparent 35%
        ),
        #fbf8f5;

    }


    img {
      max-width: 100%;
      height: auto;
    }


    a {
      color: inherit;
    }



    /* NAV */

    nav {

      width: 100%;
      max-width: 1150px;

      margin: auto;

      padding: 22px 28px;

      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

    }


    .nav-logo {

      display: flex;

      align-items: center;

      gap: 12px;

      font-weight: 800;

      color: var(--brown);

      text-decoration: none;

      flex-shrink: 0;

    }


    .nav-logo img {

      width: 48px;
      height: 48px;

      object-fit: cover;

      border-radius: 14px;

    }


    .nav-links {

      display: flex;

      align-items: center;

      gap: 24px;

      flex-wrap: wrap;

      justify-content: flex-end;

    }


    .nav-links a {

      text-decoration: none;

      color: var(--muted);

      font-weight: 600;

      font-size: 0.95rem;

      white-space: nowrap;

      transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease;

    }


    .nav-links a:hover {
      color: var(--brown);
    }


    .nav-demo {

      padding: 10px 16px;

      border-radius: 14px;

      background: var(--brown-dark);

      color: white !important;

    }



    /* HERO */

    .hero {

      width: 100%;
      max-width: 1150px;

      margin: 0 auto;

      padding:
        22px
        28px
        72px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(280px, 0.85fr);

      gap: 70px;

      align-items: center;

    }


    .hero-text {

      width: 100%;
      max-width: 570px;

    }


    .main-logo {

      width: 250px;
      max-width: 78%;

      display: block;

      margin:
        0
        auto
        2px;

    }


    .eyebrow {

      display: table;

      padding: 8px 14px;

      background: var(--pink-soft);

      color: var(--brown);

      border-radius: 100px;

      font-size: 0.88rem;

      font-weight: 700;

      margin:
        0
        auto
        13px;

    }


    h1 {

      margin:
        0
        0
        16px;

        clamp(
          2.6rem,
          5.5vw,
          4.2rem
        );
